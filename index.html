<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E4E8EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1317" media="(prefers-color-scheme: dark)">
<meta name="description" content="Photograph, categorize, and find everything you put in storage.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Storage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Storage Manifest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,600..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:opsz,wght@10..72,700..800&display=swap">
<style>
/* Layout: one phone-width column on cool concrete grey, sticky header, fixed bottom tab bar.
   Sheets cover the screen on phones and float as centered panels on wide screens.
   Boldness lives in two places: the dark camera viewfinder and the kraft box cards with stencil labels.
   Palette borrows from warehouse pallet racking: orange beams for actions, blue uprights for selection. */
:root{
  --bg:#E4E8EC;
  --surface:#FFFFFF;
  --surface-2:#EDF0F3;
  --ink:#13171C;
  --ink-2:#4F5966;
  --rule:#C6CDD4;
  --beam:#EC661D;
  --on-beam:#1B1007;
  --upright:#1D4E9E;
  --on-upright:#FFFFFF;
  --upright-tint:#D9E3F4;
  --kraft:#C9A575;
  --kraft-ink:#20170C;
  --kraft-edge:#A88350;
  --tape:rgba(255,255,255,.42);
  --stamp:#8E1020;
  --fragile:#C21F30;
  --on-fragile:#FFFFFF;
  --ok:#1E7A49;
  --warn-bg:#FCEFD4;
  --warn-ink:#553600;
  --vf-bg:#1A1F26;
  --vf-ink:#EEF2F6;
  --vf-ink-2:#A9B4C1;
  --vf-btn:rgba(255,255,255,.16);
  --knob:#FFFFFF;
  --scrim:rgba(19,23,28,.5);
  --shadow:0 1px 2px rgba(19,23,28,.08),0 6px 16px rgba(19,23,28,.07);
  --f-display:"Big Shoulders","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-stencil:"Big Shoulders Stencil","Big Shoulders","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  --tabbar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1317; --surface:#181E25; --surface-2:#131920; --ink:#E6EAEE; --ink-2:#9AA5B1; --rule:#2C353F;
    --beam:#FF7731; --on-beam:#1B1007; --upright:#82A8EC; --on-upright:#0F1317; --upright-tint:#1B2840;
    --kraft:#B48E5C; --kraft-ink:#1B1309; --kraft-edge:#8C6C42; --tape:rgba(255,255,255,.2);
    --stamp:#6E0A17; --fragile:#FF5B67; --on-fragile:#1B0306; --ok:#52C58E; --warn-bg:#3A2A0E; --warn-ink:#F7D79A;
    --vf-bg:#090C0F; --vf-ink:#EEF2F6; --vf-ink-2:#9AA5B1; --vf-btn:rgba(255,255,255,.16); --knob:#FFFFFF; --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#181E25; --surface-2:#131920; --ink:#E6EAEE; --ink-2:#9AA5B1; --rule:#2C353F;
  --beam:#FF7731; --on-beam:#1B1007; --upright:#82A8EC; --on-upright:#0F1317; --upright-tint:#1B2840;
  --kraft:#B48E5C; --kraft-ink:#1B1309; --kraft-edge:#8C6C42; --tape:rgba(255,255,255,.2);
  --stamp:#6E0A17; --fragile:#FF5B67; --on-fragile:#1B0306; --ok:#52C58E; --warn-bg:#3A2A0E; --warn-ink:#F7D79A;
  --vf-bg:#090C0F; --vf-ink:#EEF2F6; --vf-ink-2:#9AA5B1; --vf-btn:rgba(255,255,255,.16); --knob:#FFFFFF; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.32);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
[hidden]{display:none!important}
html.locked,html.locked body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--upright);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;padding:0;margin:-1px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--rule)}
.topbar-in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{width:28px;height:28px;flex:none;color:var(--beam)}
.brand-name{font:800 24px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.counts{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:500 12px/1.2 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:right}
.counts span{white-space:nowrap}
@media (max-width:420px){.brand-name{font-size:21px}.brand svg{width:24px;height:24px}.brand{gap:8px}}

/* page */
main{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(var(--tabbar-h) + 32px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.section-head h2,.h3{margin:0;font:800 21px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;text-wrap:balance}
.h3{font-size:18px}
.eyebrow,.field > label,.label{font:500 11.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.meta{margin:0;font-size:13px;color:var(--ink-2)}
.hint{margin:0;font-size:14px;color:var(--ink-2);max-width:60ch}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:700 15px/1.15 var(--f-body);cursor:pointer;text-align:center;text-decoration:none}
.btn svg{width:20px;height:20px;flex:none}
.btn:hover{border-color:var(--ink-2)}
.btn-primary{background:var(--beam);border-color:var(--beam);color:var(--on-beam)}
.btn-primary:hover{border-color:var(--beam);filter:brightness(1.06)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn-sm svg{width:17px;height:17px}
.btn-danger{color:var(--fragile)}
.btn.armed{background:var(--fragile);border-color:var(--fragile);color:var(--on-fragile)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn.more{width:100%}
.link{appearance:none;border:0;background:none;color:var(--upright);font:700 14px/1.2 var(--f-body);cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link.inline{padding:0;font-size:inherit}
.icon-btn{appearance:none;width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* scan + live camera */
.capture{display:flex;flex-direction:column;gap:12px}
.viewfinder{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;max-height:52vh;min-height:250px;border-radius:14px;overflow:hidden;color:var(--vf-ink);background-color:var(--vf-bg);background-image:radial-gradient(circle at 50% 42%,rgba(255,255,255,.07),transparent 62%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px)}
.viewfinder[data-state="live"]{aspect-ratio:1/1;max-height:64vh}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}
.viewfinder[data-state="live"] video{display:block}
.vf-start{appearance:none;border:0;background:none;color:inherit;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px 24px;cursor:pointer;text-align:center;font:inherit}
.viewfinder[data-state="live"] .vf-start{display:none}
.vf-corner{position:absolute;width:34px;height:34px;border:3px solid var(--beam);pointer-events:none;z-index:2}
.vf-corner.tl{top:14px;left:14px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.vf-corner.tr{top:14px;right:14px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.vf-corner.bl{bottom:14px;left:14px;border-right:0;border-top:0;border-bottom-left-radius:6px}
.vf-corner.br{bottom:14px;right:14px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.vf-icon{width:68px;height:68px;border-radius:50%;background:var(--beam);color:var(--on-beam);display:grid;place-items:center;transition:transform .15s ease}
.vf-icon svg{width:32px;height:32px}
.vf-title{font:800 36px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.vf-sub{font-size:15px;color:var(--vf-ink-2);max-width:32ch;text-wrap:balance}
.vf-sub:empty{display:none}
.vf-start:hover .vf-icon{transform:scale(1.05)}
.vf-start:active .vf-icon{transform:scale(.96)}
.viewfinder[data-state="starting"] .vf-icon{opacity:.6}
.vf-controls{position:absolute;left:0;right:0;bottom:16px;z-index:3;display:none;align-items:center;justify-content:center;gap:22px}
.viewfinder[data-state="live"] .vf-controls{display:flex}
.vf-btn{appearance:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--vf-btn);color:var(--vf-ink);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vf-btn svg{width:22px;height:22px}
.vf-btn[aria-pressed="true"]{background:var(--beam);color:var(--on-beam)}
.shutter{appearance:none;width:76px;height:76px;border-radius:50%;border:5px solid var(--vf-ink);background:var(--beam);cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.35);transition:transform .1s ease}
.shutter:active{transform:scale(.92)}
.vf-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.vf-flash.go{animation:flash .35s ease-out}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.capture-alt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);cursor:pointer}
.switch-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.switch-title{font-weight:700}
.switch-sub{font-size:13px;color:var(--ink-2)}
.switch{appearance:none;-webkit-appearance:none;margin:0;width:48px;height:28px;border-radius:999px;background:var(--rule);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch:checked{background:var(--upright)}
.switch:checked::after{transform:translateX(20px)}
.ai-note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0;font-size:13px;color:var(--ink-2)}
.ai-note p{margin:0;flex:1 1 220px;min-width:0}
.ai-note.warn{padding:12px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn-ink);font-size:14px}
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 14px;border:1px dashed var(--ink-2);border-radius:var(--r);font-size:14px;color:var(--ink-2)}
.notice p{margin:0;flex:1 1 220px;min-width:0}
.notice b{color:var(--ink)}
.empty{padding:20px 18px;border:1px dashed var(--rule);border-radius:var(--r);color:var(--ink-2);font-size:15px;background:var(--surface)}
.empty strong{display:block;margin-bottom:6px;color:var(--ink);font:800 20px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}

/* rows */
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.row{appearance:none;border:0;background:none;color:inherit;text-align:left;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;cursor:pointer;width:100%;font:inherit}
.rows > .row + .row{border-top:1px solid var(--rule)}
.row:hover{background:var(--surface-2)}
.row.noloc{grid-template-columns:56px minmax(0,1fr)}
.thumb{position:relative;display:block;width:56px;height:56px;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.thumb img,.photo-lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.ph{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--bg) 6px 12px)}
.ph span{font:800 16px/1 var(--f-stencil);letter-spacing:.06em;color:var(--ink-2)}
.row-main{display:flex;flex-direction:column;gap:5px;min-width:0}
.row-name{font-weight:700;font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--ink-2);min-width:0}
.code{font:500 11.5px/1 var(--f-mono);letter-spacing:.06em;padding:3px 5px;border:1px solid var(--rule);border-radius:4px;color:var(--ink);background:var(--surface)}
.row-loc{display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:9.5rem;min-width:0;text-align:right}
.loc-label{font:800 19px/1 var(--f-stencil);letter-spacing:.04em;color:var(--ink);overflow-wrap:anywhere}
.loc-label.none{font:500 12px/1.2 var(--f-mono);letter-spacing:.02em;color:var(--ink-2)}
.loc-place{font-size:12px;line-height:1.25;color:var(--ink-2);overflow-wrap:anywhere}
.pct{font:500 12px/1 var(--f-mono);color:var(--upright)}
.flag-fragile{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--fragile)}

/* log */
.searchbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.search{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 12px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;min-width:0}
.search:focus-within{border-color:var(--upright);box-shadow:0 0 0 3px var(--upright-tint)}
.search svg{width:20px;height:20px;color:var(--ink-2);flex:none}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:16px var(--f-body);outline:none;height:46px}
.btn-match{min-height:48px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{appearance:none;flex:none;display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font:700 14px/1 var(--f-body);cursor:pointer;white-space:nowrap}
.chip b{font:500 12px/1 var(--f-mono);color:var(--ink-2)}
.chip.on{background:var(--upright);border-color:var(--upright);color:var(--on-upright)}
.chip.on b,.chip.on .code{color:inherit;border-color:currentColor;background:transparent}
.chip .code{padding:2px 4px}
.chip-sm{min-height:32px;padding:0 10px;font-size:13px}
.list-head{font-size:14px;color:var(--ink-2);margin:0}
.list-head:empty{display:none}
.list-head q{color:var(--ink);font-weight:700}
.log-foot{display:flex;flex-direction:column;gap:10px}
.log-foot:empty{display:none}
.match{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.match-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule)}
.match-seen{display:flex;align-items:center;gap:12px;padding:12px}
.match-seen img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--vf-bg)}
.match-seen > div{min-width:0}
.seen{font-weight:700;font-size:16px}
.mrow{border-top:1px solid var(--rule);display:flex;flex-direction:column}
.best-tag{align-self:flex-start;margin:10px 12px 0;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--beam);color:var(--on-beam);padding:4px 6px;border-radius:4px}
.why{margin:-4px 12px 12px 80px;font-size:13px;color:var(--ink-2)}
.match-none{margin:0;padding:0 12px 14px;color:var(--ink-2);font-size:14px}
.status-title{font-weight:700;font-size:16px}
.status-sub{font-size:13px;color:var(--ink-2)}

/* boxes */
.place{display:flex;flex-direction:column;gap:10px}
.place-head{margin:0;display:flex;align-items:center;gap:10px;font:500 12px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.place-head::after{content:"";flex:1;height:1px;background:var(--rule)}
.boxgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.boxcard,.boxhero{position:relative;border-radius:6px;background-color:var(--kraft);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0 2px,transparent 2px 7px);color:var(--kraft-ink);box-shadow:inset 0 -3px 0 var(--kraft-edge),var(--shadow);overflow:hidden}
.boxcard{appearance:none;border:0;text-align:left;padding:24px 14px 14px;min-height:138px;display:flex;flex-direction:column;gap:6px;cursor:pointer;font:inherit}
.boxcard:hover{filter:brightness(1.04)}
.tape{position:absolute;top:0;left:50%;width:46%;height:16px;transform:translateX(-50%);background:var(--tape)}
.boxcard-label{font:800 34px/.95 var(--f-stencil);letter-spacing:.03em;overflow-wrap:anywhere}
.boxcard-count{font:500 13px/1.2 var(--f-mono)}
.boxcard-cats{font:500 12px/1.35 var(--f-mono);opacity:.85}
.stamp{align-self:flex-start;margin-top:auto;transform:rotate(-6deg);font:800 15px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);border-radius:4px;padding:4px 7px 3px}
.boxcard.loose{background:var(--surface);background-image:none;color:var(--ink);border:2px dashed var(--rule);box-shadow:none}
.boxcard.loose .boxcard-label{font-family:var(--f-display);font-size:30px}
.boxhero{padding:28px 18px 18px;display:flex;flex-direction:column;gap:6px}
.boxhero-label{font:800 54px/.9 var(--f-stencil);letter-spacing:.03em;overflow-wrap:anywhere}
.boxhero-place{font-weight:700;font-size:16px}

/* sheets */
#sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;outline:none}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:var(--bg)}
.sheet-head h2{margin:0;font:800 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;min-width:0}

.shot{position:relative;flex:none;width:100%;max-width:100%;aspect-ratio:4/3;max-height:42vh;border-radius:12px;overflow:hidden;background:var(--vf-bg)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}

.in{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);font:16px/1.3 var(--f-body)}
.in:focus{outline:none;border-color:var(--upright);box-shadow:0 0 0 3px var(--upright-tint)}
.in[disabled]{background:var(--surface-2);color:var(--ink-2)}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.in.name{font-weight:700;font-size:18px}
.in-stencil{font:800 24px/1 var(--f-stencil);letter-spacing:.04em}
.in.mono{font-family:var(--f-mono);font-size:15px}
.name-row{display:flex;gap:8px;align-items:stretch}
.name-row .in{flex:1;min-width:0}
.name-row .btn{min-height:46px}
.grid-cq{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:minmax(0,1fr)}}
.check{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 14px;border:1px solid var(--rule);border-radius:999px;cursor:pointer;font-weight:700;align-self:flex-start;background:var(--surface)}
.check input{width:20px;height:20px;margin:0;accent-color:var(--fragile)}
.check:has(input:checked){border-color:var(--fragile);color:var(--fragile)}
.check.plain input{accent-color:var(--upright)}
.check.plain:has(input:checked){border-color:var(--upright);color:var(--ink)}
.idline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2);margin-top:-4px}
.conf{font:500 12px/1 var(--f-mono);padding:5px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink)}

.tip{margin:0;font-size:14px;color:var(--ink-2)}

.bc-label{font:800 23px/1 var(--f-stencil);letter-spacing:.03em;overflow-wrap:anywhere}

.boxchip.on{border-color:var(--upright);box-shadow:0 0 0 3px var(--upright-tint),inset 0 -2px 0 var(--kraft-edge)}

.boxchip.new.on,.boxchip.none.on{border-style:solid;border-color:var(--upright);box-shadow:0 0 0 3px var(--upright-tint)}
.newbox{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
@media (max-width:440px){.newbox{grid-template-columns:minmax(0,1fr)}}
.photo-lg{position:relative;flex:none;width:100%;max-width:100%;aspect-ratio:4/3;max-height:46vh;border-radius:12px;overflow:hidden;background:var(--vf-bg)}

.tipbox{padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--rule)}

.setsec{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.setsec h3{margin:0}
.setsec details summary{cursor:pointer;font-weight:700}
.setsec details[open] summary{margin-bottom:10px}
.state-line{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--rule);flex:none}
.dot.on{background:var(--ok)}
.dot.warn{background:var(--beam)}
.version{text-align:center}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(3,1fr)}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:500 11.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;position:relative;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;background:var(--beam);border-radius:0 0 3px 3px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:700;font-size:15px;width:max-content;max-width:min(92vw,480px);box-shadow:var(--shadow);transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important}
  .shot.scanning .scanline{animation:none;top:50%}
  .skel::after{animation:none}
  .vf-flash.go{animation:none}
}
</style>
</head>

<main>

<script>
(() => {
"use strict";

const VERSION = "1.0.0";
const API_URL = "https://api.anthropic.com/v1/messages";
const DEFAULT_MODELS = { fast: "claude-haiku-5-5", careful: "claude-sonnet-5-5" };

/* ---------- vocabulary ---------- */
const CATS = [
  ["KIT", "Kitchen"], ["TLS", "Tools & Hardware"], ["ELC", "Electronics & Cables"], ["BKS", "Books & Papers"],
  ["CLO", "Clothing & Shoes"], ["LIN", "Linens & Bedding"], ["HOL", "Holiday & Seasonal"], ["SPT", "Sports & Outdoor"],
  ["GDN", "Garden & Patio"], ["TOY", "Toys & Games"], ["DEC", "Decor & Art"], ["OFF", "Office & Craft"],
  ["KEP", "Keepsakes"], ["HSE", "Household & Cleaning"], ["FUR", "Furniture & Large Items"], ["OTH", "Other"]
];
const CAT = Object.fromEntries(CATS);
const CAT_LIST = CATS.map(([c, n]) => c + " = " + n).join("\n");

const IDENTIFY_PROMPT = `You are cataloging household items that are going into storage. Look at the photo.

List each distinct item worth logging. Usually that is one item. If the photo shows several separate items (for example a box's contents laid out on a table), list each one, up to 10. Ignore hands, walls, floors, tables and other background.

Category codes:
${CAT_LIST}

Reply with only JSON in this shape:
{"items":[{"name":"12-inch cast iron skillet","cat":"KIT","sub":"Cookware","desc":"Black cast iron pan with a short helper handle and a raised logo on the base","tags":["skillet","frying pan","cast iron","cookware"],"qty":1,"fragile":false,"confidence":0.92,"alternatives":[],"tip":"Rub with a little oil and wrap in paper so it does not rust"}]}

Field rules:
- name: specific, 3 to 7 words. Include brand, size, color or count when visible.
- cat: exactly one code from the list. Use OTH only if nothing else fits.
- sub: 1 to 3 words.
- desc: one sentence of visual details that would help recognize this exact item later.
- tags: 3 to 8 lowercase search words, including common synonyms.
- qty: how many of this item are visible. A matched set counts as 1.
- fragile: true if it could break, crack or bend in a packed box.
- confidence: 0 to 1, how sure you are about what the item is.
- alternatives: up to 2 other things it could be when confidence is below 0.8, otherwise [].
- tip: one short packing or storage tip for this specific item.
If no item is visible, reply {"items":[]}.`;

const categorizePrompt = name => `Categorize this household item for a storage log: ${JSON.stringify(name)}

Category codes:
${CAT_LIST}

Reply with only JSON in this shape:
{"cat":"HOL","sub":"Tree accessories","tags":["tree stand","christmas","holiday"],"fragile":false,"tip":"Tape the screws to the base so they stay together"}

- cat: exactly one code from the list.
- sub: 1 to 3 words.
- tags: 3 to 8 lowercase search words, including common synonyms.
- fragile: true if it could break, crack or bend in a packed box.
- tip: one short packing or storage tip for this item.`;

const DESCRIBE_PROMPT = `Name the main item in this photo so it can be searched for. Reply with only JSON in this shape:
{"name":"short specific name","tags":["3 to 8 lowercase search words, including synonyms"]}`;

const matchPrompt = lines => `Someone is looking for an item in their storage log. The photo shows the item they want to find, or something that looks like it.

Their log, one item per line (ref | name | category | details | tags):
${lines}

Pick the logged items that best match the photo. Reply with only JSON in this shape:

const store = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!("indexedDB" in window)) { rej(new Error("IndexedDB unavailable")); return; }
      const r = indexedDB.open("storage-manifest", 1);
      r.onupgradeneeded = () => { const d = r.result; for (const n of ["items", "boxes", "photos"]) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error("blocked"));
    });

  }
  async function run(name, mode, fn) {
    const d = await open();

      let out;
      const req = fn(s);
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error("aborted"));
    });
  }
  return {
    open,
    all: name => run(name, "readonly", s => s.getAll()),
    get: (name, key) => run(name, "readonly", s => s.get(key)),
    put: (name, key, val) => run(name, "readwrite", s => s.put(val, key)),
    del: (name, key) => run(name, "readwrite", s => s.delete(key)),
    clear: name => run(name, "readwrite", s => s.clear()),

})();

}

/* ---------- closest-match text search ---------- */
const STOP = new Set(["the", "a", "an", "of", "and", "or", "in", "on", "for", "with", "my", "to", "is", "where", "did", "i", "put", "it", "its"]);
const norm = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const toks = s => { const n = norm(s); return n ? n.split(" ").filter(t => !STOP.has(t)) : []; };
const triCache = new Map();
function tri(t) {
  let s = triCache.get(t);
  if (!s) {
    s = new Set(); const p = " " + t + " ";
    for (let i = 0; i < p.length - 2; i++) s.add(p.slice(i, i + 3));
    if (triCache.size > 20000) triCache.clear();
    triCache.set(t, s);
  }
  return s;
}
function sim(q, t) {
  if (q === t) return 1;
  if (q.length >= 2 && t.length > q.length && t.startsWith(q)) return 0.9;
  if (t.length >= 3 && q.length > t.length && q.startsWith(t)) return 0.85;
  if (q.length < 3 || t.length < 3) return 0;
  const a = tri(q), b = tri(t); let n = 0;
  for (const x of a) if (b.has(x)) n++;
  const j = n / (a.size + b.size - n);
  return j >= 0.3 ? Math.min(0.8, j * 1.1) : 0;
}

  const b = it.box && boxMap.get(it.box);
  return [
    [toks(it.name), 3],
    [toks(it.tags.join(" ")), 2.4],
    [toks(it.cat + " " + CAT[it.cat] + " " + it.sub), 1.6],
    [toks(b ? b.label + " " + b.place : ""), 1.6],
    [toks(it.desc + " " + it.notes), 1.1]

}
function rank(q, list) {
  const qt = toks(q); if (!qt.length) return [];
  const qn = norm(q), out = [];
  for (const it of list) {
    const f = it._f || (it._f = fieldsOf(it));
    let tot = 0;
    for (const w of qt) {
      let best = 0;
      for (const [ts, wt] of f) {
        if (best >= wt) continue;
        for (const t of ts) { const s = sim(w, t) * wt; if (s > best) best = s; }
      }
      tot += best;
    }
    let score = tot / (qt.length * 3);
    if (qn.length >= 3 && norm(it.name).includes(qn)) score = Math.max(score, 0.97);
    if (score > 0) out.push({ item: it, score: Math.min(1, score) });
  }
  return out.sort((a, b) => b.score - a.score || newest(a.item, b.item));
}

/* photo match */
async function startMatch(file) {
  if (S.match && S.match.ctl) { try { S.match.ctl.abort(); } catch (e) { /* ignore */ } }
  const m = { status: "prep", started: Date.now(), ctl: new AbortController(), photoUrl: null };
  S.match = m; renderMatch();
  let blob;
  try {
    const src = await decodeImage(file);
    try { blob = await encodeJpeg(src, 1280, 0.85); } finally { if (src.close) { try { src.close(); } catch (e) { /* ignore */ } } }
  } catch (e) {
    if (S.match === m) { S.match = { status: "error", msg: "This photo couldn't be opened. Try a JPEG or PNG." }; renderMatch(); }
    return;
  }
  if (S.match !== m) return;
  m.photoUrl = URL.createObjectURL(blob); m.status = "loading"; renderMatch();
  try {
    const image = await blobToBase64(blob);
    let pool = S.items;
    if (pool.length > 400) {
      const seen = await askJSON({ text: DESCRIBE_PROMPT, image, maxTokens: 2000, signal: m.ctl.signal });
      const q = [str(seen && seen.name, 80)].concat(seen && Array.isArray(seen.tags) ? seen.tags.map(t => str(t, 30)) : []).join(" ");
      const ranked = rank(q, pool).slice(0, 300).map(h => h.item);
      pool = ranked.length >= 20 ? ranked : pool.slice().sort(newest).slice(0, 400);
    }
    const refs = new Map();
    const lines = pool.map((it, k) => {
      const ref = "i" + (k + 1); refs.set(ref, it.id);
      return `${ref} | ${clip(it.name, 80)} | ${it.cat} ${CAT[it.cat]} | ${clip(it.desc || it.sub, 120)} | ${clip(it.tags.slice(0, 6).join(", "), 80)}`;
    }).join("\n");
    const res = await askJSON({ text: matchPrompt(lines), image, careful: careful(), maxTokens: 6000, signal: m.ctl.signal });
    if (S.match !== m) return;
    const used = new Set();
    const matches = (res && Array.isArray(res.matches) ? res.matches : [])
      .map(x => ({ id: refs.get(String((x && x.ref) || "").trim()), score: clampNum(x && x.score, 0, 1, 0), why: str(x && x.why, 140) }))
      .filter(x => x.id && !used.has(x.id) && used.add(x.id))
      .sort((a, b) => b.score - a.score).slice(0, 5);
    S.match = { status: "done", seen: str(res && res.seen, 80), matches, photoUrl: m.photoUrl };
  } catch (e) {
    if (S.match !== m) return;
    if (e && e.code === "cancelled") { URL.revokeObjectURL(m.photoUrl); S.match = null; }
    else S.match = { status: "error", photoUrl: m.photoUrl, msg: aiCopy(e).replace(", or fill in the details below", "").replace(" Fill in the details below.", "") };
  }
  renderLog();
}
function clearMatch() {
  if (S.match) {
    if (S.match.ctl) { try { S.match.ctl.abort(); } catch (e) { /* ignore */ } }
    if (S.match.photoUrl) URL.revokeObjectURL(S.match.photoUrl);
  }
  S.match = null; renderMatch();
}

    </div>`);
  renderSettingsBackup();
  (async () => {
    let persisted = null;
    try { if (navigator.storage && navigator.storage.persisted) persisted = await navigator.storage.persisted(); } catch (e) { /* unknown */ }
    const dot = $("#persist-dot"), st = $("#persist-state");
    if (!dot || !st) return;
    dot.className = "dot" + (persisted ? " on" : " warn");
    st.textContent = persisted ? "Storage is marked as persistent" : "The browser may clear this data if space runs low. Keep backups.";
  })();
}
function renderSettingsBackup() {
  const st = $("#bk-state"), dot = $("#bk-dot");
  if (!st || !dot) return;
  const last = Number(ls.get("sm.lastBackup", "0"));
  st.textContent = last ? "Last backup " + fmtDate(last) : "No backup yet";
  dot.className = "dot" + (last && Date.now() - last < 14 * 864e5 ? " on" : " warn");
  const ps = $("#pending-save");
  if (ps) ps.innerHTML = pendingFile ? `<button type="button" class="btn btn-sm" data-act="save-pending">${ICON.download}Save ${esc(pendingFile.name)}</button>` : "";
}
async function offerFile(file) {
  if (navigator.canShare && navigator.share) {
    let ok = false;
    try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
    if (ok) {
      try { await navigator.share({ files: [file], title: file.name }); return "shared"; }
      catch (e) {
        if (e && e.name === "AbortError") return "cancelled";
        if (e && e.name === "NotAllowedError") return "needs-tap";
      }
    }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url; a.download = file.name; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return "downloaded";
}
async function deliver(file, onDone) {
  const how = await offerFile(file);
  if (how === "needs-tap") { pendingFile = { file, onDone, name: file.name }; renderSettingsBackup(); toast("Ready. Tap the save button to finish."); return; }
  pendingFile = null; renderSettingsBackup();
  if (how !== "cancelled" && onDone) onDone(how);
}
async function makeBackup(btn) {
  btn.disabled = true; const old = btn.innerHTML; btn.textContent = "Preparing…";
  try {
    const withPhotos = $("#bk-photos") ? $("#bk-photos").checked : true;
    const photos = {};
    if (withPhotos) {
      for (const id of new Set(S.items.map(i => i.photo).filter(Boolean))) {
        const p = await store.get("photos", id);
        if (p && p.buf) photos[id] = await blobToDataUrl(new Blob([p.buf], { type: p.type || "image/jpeg" }));
      }
    }
    const data = { app: "storage-manifest", format: 1, exportedAt: new Date().toISOString(), items: S.items.map(plainItem), boxes: S.boxes.map(b => Object.assign({}, b)), photos };
    const file = new File([JSON.stringify(data)], "storage-manifest-backup-" + isoDay(Date.now()) + ".json", { type: "application/json" });
    await deliver(file, how => { ls.set("sm.lastBackup", String(Date.now())); renderSettingsBackup(); renderScan(); toast(how === "shared" ? "Backup saved" : "Backup downloaded"); });
  } catch (e) { toast("Couldn't create the backup."); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}
async function restoreBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast("That file isn't a Storage Manifest backup."); return; }
  if (!data || data.app !== "storage-manifest" || !Array.isArray(data.items) || !Array.isArray(data.boxes)) { toast("That file isn't a Storage Manifest backup."); return; }
  try {
    const items = data.items.map(normItem).filter(i => i.id);
    const boxes = data.boxes.map(normBox).filter(b => b.id);
    const photoEntries = [];
    const src = data.photos && typeof data.photos === "object" ? data.photos : {};
    for (const [id, url] of Object.entries(src)) {
      if (!/^[A-Za-z0-9_-]{8,80}$/.test(id) || typeof url !== "string" || !/^data:image\/(jpeg|png|webp);base64,/.test(url)) continue;
      const buf = await (await fetch(url)).arrayBuffer();
      photoEntries.push([id, { type: url.slice(5, url.indexOf(";")), buf }]);
    }
    for (const it of items) if (it.photo && !src[it.photo]) {
      const have = await store.get("photos", it.photo).catch(() => null);
      if (!have) it.photo = null;
    }
    if (photoEntries.length) await store.putMany("photos", photoEntries);
    await store.putMany("boxes", boxes.map(b => [b.id, b]));
    await store.putMany("items", items.map(it => [it.id, plainItem(it)]));
    await loadAll();
    askPersist();
    toast(`Restored ${plural(items.length, "item")} and ${plural(boxes.length, "box", "boxes")}`);
    if (S.sheet && S.sheet.type === "settings") openSettings();
  } catch (e) { toast(storeErrCopy(e)); }
}
const csvCell = v => { let s = v == null ? "" : String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCsv() {
  if (!S.items.length) { toast("Nothing to export yet."); return; }
  const head = ["Name", "Category", "Subcategory", "Qty", "Fragile", "Box", "Place", "Tags", "Notes", "Description", "Logged"];
  const rows = S.items.slice().sort(newest).map(i => { const b = i.box && boxMap.get(i.box); return [i.name, CAT[i.cat], i.sub, i.qty, i.fragile ? "yes" : "", b ? b.label : "", b ? b.place : "", i.tags.join(", "), i.notes, i.desc, i.createdAt ? isoDay(i.createdAt) : ""]; });
  const csv = [head].concat(rows).map(r => r.map(csvCell).join(",")).join("\r\n");
  deliver(new File([csv], "storage-manifest-" + isoDay(Date.now()) + ".csv", { type: "text/csv" }), how => toast(how === "shared" ? "CSV ready" : "CSV downloaded"));
}
async function wipeAll(btn) {
  if (!armed(btn, "Tap again to delete all")) return;
  try {
    await Promise.all([store.clear("items"), store.clear("boxes"), store.clear("photos")]);
    ls.del("sm.lastBox"); ls.del("sm.lastBackup");
    S.items = []; S.boxes = [];
    reindex(); renderAll(); closeSheet(); toast("Everything was deleted from this phone");
  } catch (e) { toast(storeErrCopy(e)); }
}
async function testKey(btn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = "Testing…";
  try { await askClaude({ text: "Reply with the single word OK.", maxTokens: 400 }); toast("Your key works"); }
  catch (e) { toast(e && e.code === "invalid_json" ? "Your key works" : aiCopy(e).split(". ")[0] + "."); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = old; } }
}

/* ---------- tabs + toast ---------- */
function setTab(t, quiet) {
  S.tab = t;
  for (const v of ["scan", "log", "boxes"]) $("#view-" + v).hidden = v !== t;
  $$(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.tab === t ? "page" : "false"));
  if (t !== "scan" && cam.stream) stopCamera(true);
  else if (t === "scan" && cam.wanted && !cam.stream && !S.sheet) startCamera();
  renderAll();
  if (!quiet) window.scrollTo(0, 0);
}
let toastT = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3400);
}
setInterval(() => {
  for (const el of document.querySelectorAll(".tick[data-start]")) el.textContent = Math.max(0, Math.round((Date.now() - Number(el.dataset.start)) / 1000)) + "s";
}, 1000);

/* ---------- events ---------- */
let qT = null;
const dupT = {};
function takeFile(input, fn) { const f = input.files && input.files[0]; input.value = ""; if (f) fn(f); }
function onClick(e) {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case "tab": setTab(el.dataset.tab); break;
    case "settings": openSettings(); break;
    case "cam-start": startCamera(); break;
    case "cam-stop": stopCamera(); break;
    case "cam-snap": snap(); break;
    case "cam-flip": flipCamera(); break;
    case "cam-torch": toggleTorch(); break;
    case "pick-camera": $("#cam").click(); break;
    case "pick-library": $("#lib").click(); break;
    case "manual": startReview(null); break;
    case "close-sheet": closeSheet(); break;
    case "stop-id": if (R && R.ctl) R.ctl.abort(); break;
    case "recheck": if (R) identify(R, true); break;
    case "retry-id": if (R) identify(R, careful()); break;
    case "use-alt": { const input = $("#c" + el.dataset.i + "-name"); if (input) { input.value = el.dataset.alt; refreshDupes(el.dataset.i); } break; }
    case "categorize": categorize(el.dataset.i, el); break;
    case "box-pick": if (R) { R.boxTouched = true; R.boxChoice = { kind: "box", id }; renderReviewBox(); } break;
    case "box-new": if (R) { R.boxTouched = true; R.boxChoice = { kind: "new" }; renderReviewBox(); } break;
    case "box-none": if (R) { R.boxTouched = true; R.boxChoice = { kind: "none" }; renderReviewBox(); } break;
    case "save-review": saveReview(); break;
    case "open-item": {
      const sh = S.sheet;
      const back = sh && sh.type === "box" && boxMap.get(sh.id) ? { type: "box", id: sh.id, label: boxMap.get(sh.id).label } : sh && sh.type === "loose" ? { type: "loose", id: "", label: "Loose" } : null;
      openItem(id, back); break;
    }
    case "save-item": saveItem(id); break;
    case "del-item": delItem(id, el); break;
    case "item-photo": { const inp = $("#itemphoto"); inp.dataset.id = id; inp.click(); break; }
    case "open-box": openBox(id); break;
    case "open-loose": openLoose(); break;
    case "new-box": openNewBox(); break;
    case "create-box": createBox(); break;
    case "save-box": updateBox(id); break;
    case "del-box": delBox(id, el); break;
    case "copy-list": copyList(); break;
    case "cat": S.cat = el.dataset.cat; S.limit = 150; renderLog(); break;
    case "more": S.limit += 150; renderLog(); break;
    case "match-photo":
      if (!S.items.length) toast("Log a few items first, then match a photo against them.");
      else if (!aiOn()) toast("Add your Claude API key in Settings to match photos.");
      else $("#matchfile").click();
      break;
    case "match-stop": if (S.match && S.match.ctl) S.match.ctl.abort(); break;
    case "match-clear": clearMatch(); break;
    case "export-csv": exportCsv(); break;
    case "backup": makeBackup(el); break;
    case "restore": $("#restorefile").click(); break;
    case "save-pending": if (pendingFile) { const p = pendingFile; pendingFile = null; renderSettingsBackup(); deliver(p.file, p.onDone); } break;
    case "wipe": wipeAll(el); break;
    case "key-save": {
      const v = ($("#set-key").value || "").trim();
      if (!v) { toast("Paste your key first."); break; }
      if (!/^sk-ant-/.test(v)) { toast("That doesn't look like a Claude API key. Keys start with sk-ant-."); break; }
      ls.set("sm.apiKey", v); toast("Key saved on this phone"); openSettings(); renderAll(); break;
    }
    case "key-test": testKey(el); break;
    case "key-remove": if (armed(el, "Tap again to remove")) { ls.del("sm.apiKey"); toast("Key removed"); openSettings(); renderAll(); } break;
    case "models-save": {
      const f = ($("#set-fast").value || "").trim(), c = ($("#set-careful").value || "").trim();
      if (f) ls.set("sm.modelFast", f); else ls.del("sm.modelFast");
      if (c) ls.set("sm.modelCareful", c); else ls.del("sm.modelCareful");
      toast("Models saved"); break;
    }
    case "models-reset": ls.del("sm.modelFast"); ls.del("sm.modelCareful"); $("#set-fast").value = DEFAULT_MODELS.fast; $("#set-careful").value = DEFAULT_MODELS.careful; toast("Models reset"); break;
  }
}
function onChange(e) {
  const t = e.target;
  if (t.id === "careful") { ls.set("sm.careful", t.checked ? "1" : "0"); return; }
  if (!R) return;
  if (t.classList.contains("keep")) { const card = t.closest(".card"); if (card) card.classList.toggle("off", !t.checked); renderReviewFoot(); renderReviewBox(); }
  else if (t.classList.contains("cat") && t.closest("#review-cards")) renderReviewBox();
}
function onInput(e) {
  const t = e.target;
  if (t.id === "q") { clearTimeout(qT); qT = setTimeout(() => { S.query = t.value; S.limit = 150; renderLog(); }, 120); return; }
  if (t.id === "box-label") { const h = $("#bh-label"); if (h) h.textContent = t.value || "Box"; return; }
  if (t.id === "box-place") { const h = $("#bh-place"); if (h) h.textContent = t.value || "No place set"; return; }
  if (!R) return;
  if (t.id === "nb-label") { R.newBox.label = t.value; R.newBox.edited = true; }
  else if (t.id === "nb-place") R.newBox.place = t.value;
  else if (t.classList.contains("name") && t.dataset.i != null) { const i = t.dataset.i; clearTimeout(dupT[i]); dupT[i] = setTimeout(() => refreshDupes(i), 250); }
}
function boot() {
  document.addEventListener("click", onClick);
  document.addEventListener("change", onChange);
  document.addEventListener("input", onInput);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });
  document.addEventListener("error", e => { const t = e.target; if (t && t.tagName === "IMG" && t.dataset && t.dataset.ph) t.hidden = true; }, true);
  $("#cam").addEventListener("change", e => takeFile(e.target, startReview));
  $("#lib").addEventListener("change", e => takeFile(e.target, startReview));
  $("#matchfile").addEventListener("change", e => takeFile(e.target, startMatch));
  $("#itemphoto").addEventListener("change", e => { const id = e.target.dataset.id; takeFile(e.target, f => addItemPhoto(id, f)); });
  $("#restorefile").addEventListener("change", e => takeFile(e.target, restoreBackup));
  $("#careful").checked = ls.get("sm.careful", "0") === "1";
  renderCam();
  const h = (location.hash || "").slice(1);
  if (h === "log" || h === "boxes") setTab(h, true); else renderAll();
  loadAll();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
})();
</script>
